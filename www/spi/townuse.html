<BODY>

<P><CENTER><FONT SIZE="+1">スピを街乗りに使う</FONT></CENTER></P>

<P>それは、暑くて大変。背中には巨大なラジエータをしょっていて、座席との仕切りはアルミ板1枚。とても暑い。しかも、フレームにも熱が伝わってきて、サイドフレームの後ろ側はとても触れるもので無い。走っていても、意外と風は巻き込まないので熱気は抜けない。ベンチレーションが無いので扇風機をつけようとしたら、シガーライターも無いのでやる気もうせた。いっそのこと、足元に穴をあけて網でも貼ろうかと考え中。</P>
