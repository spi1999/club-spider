                    <td><font size="2">＃１～５<br>
                      ラテミの会場にて。<br>

                      １０台近くまとまって、しかも遅刻しての入場は異様ともいえる雰囲気に熱い視線を<br>
                      感じてしまいます。<br>
                      <br>
                      ＃５<br>
                      昼飯の焼肉です。<br>
                      <br>
                      ＃６<br>
                      みんな揃って東海北陸道 
                      川島ＳＡでの記念写真です。<br>
                      会場ではさんざんな大雨＋雷でしたが、山を降りたら、ほらこの通り『晴れ』ですわ。<br>
                      雨男は誰？<br>
                      <br>
